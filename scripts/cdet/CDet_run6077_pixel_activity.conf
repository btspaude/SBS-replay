# Uncut recorded-channel activity; independent of timing/response selections.
config.version: 1
analysis.run_number: 6077
# -1 reads all events. Use a finite number for a quick check.
analysis.events: -1
# -1/-1 selects all segment groups and their ROOT rollover files.
analysis.min_segment: -1
analysis.max_segment: -1
# Output: CDetPixelActivity/<tag>/; empty tag defaults to run<run>.
pixel_activity.output_tag:
