# Configuration for PlotPairingVariables.C. The naming follows the
# CDet_run6077_projection.conf convention: analysis, cuts, plots, and output
# are kept in one TEnv-style file.
# ROOT: .L PlotPairingVariables.C+
#       PlotPairingVariables("PlotPairingVariables.conf");
config.version: 1

analysis.run_number: 6077
# Empty uses OUT_DIR; alternatively pass a directory as the second call argument.
analysis.input_directory:
analysis.events: 10000000
# -1 means all available segments; set both to restrict the run.
# Analyze segment 15 and later; -1 means no upper limit.
analysis.min_segment: 15
analysis.max_segment: 35
# Focused plots select all 16 Layer-1 pixels in this bar by default. Set
# analysis.layer1_pixel below to a nonnegative logical pixel ID for a single-
# pixel study; its containing bar is then derived automatically.
analysis.layer1_bar: 30
# -1 keeps the focused plots on all pixels in analysis.layer1_bar. Set a
# zero-based Layer-1 pixel ID here when doing a pixel-specific study.
analysis.layer1_pixel: -1

# Additional cuts on stored pairs, applied to both the focused plots and scan.
# Both members must pass this inclusive ToT interval (ns).
cuts.member_tot_min_ns: 8
cuts.member_tot_max_ns: 35
# -1 disables the extra cut. These do not undo upstream replay selections.
cuts.layer_dt_max_ns: -1
# Adopted Run-6077 ECal trajectory-time ellipse: R <= 2.
# The stored pair.ecal_score is R^2, so the code applies pair.ecal_score <= 4.
cuts.pair_radius_max: 2
# Event-level ECal ADC-time selection.
cuts.ecal_time_min_ns: -10
cuts.ecal_time_max_ns: 4
cuts.ecal_energy_min_gev: 3.0
cuts.ecal_energy_max_gev: 4.5

# Histogram display ranges, NOT selection cuts. Sigma includes overflow.
plots.bin_width_ns: 0.5
plots.le_min_ns: 0
plots.le_max_ns: 60
# Focused-pixel LE spectra. These may move with bar/pixel location.
plots.bar_le_min_ns: 0
plots.bar_le_max_ns: 60
plots.layer_dt_min_ns: -15
plots.layer_dt_max_ns: 15
plots.ecal_dt_min_ns: -40
plots.ecal_dt_max_ns: 0
plots.min_entries_per_bar: 30
# Geometry display ranges. The x residual SD is the rough position-resolution
# estimate; angle is the constrained transport x-versus-z slope in degrees.
plots.x_diff_min_m: -0.5
plots.x_diff_max_m: 0.5
plots.x1_min_m: -1.6
plots.x1_max_m: 1.6
# Focused-pixel x1 display. x1 can move with detector location; residuals do not.
plots.bar_x1_min_m: -0.8
plots.bar_x1_max_m: -0.6
# Focused-bar angle display. All-detector angle plots use angle_min/max.
plots.bar_angle_min_deg: -40
plots.bar_angle_max_deg: 40
plots.x_residual_min_m: -0.2
plots.x_residual_max_m: 0.2
plots.angle_min_deg: -40
plots.angle_max_deg: 40
plots.angle_bin_width_deg: 0.1

# 0: display only; 1: save all eight canvases as PNG and PDF plus per-bar CSV.
# Paths are relative to the current working directory. Reusing a directory
# with the same run/bar overwrites those outputs; use a new directory per study.
output.save_plots: 1
output.directory: pairing_plots/run6077_baseline
