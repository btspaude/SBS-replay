# Configuration for PlotPairingVariables.C (not the legacy projection macro).
# ROOT: .L PlotPairingVariables.C+
#       PlotPairingVariables("PlotPairingVariables.conf");
config.version: 1

analysis.run_number: 6077
# Empty uses OUT_DIR; alternatively pass a directory as the second call argument.
analysis.input_directory:
analysis.events: -1
# Only the first two canvases select this L1 half-bar; the scan includes all bars.
analysis.layer1_bar: 30

# Additional cuts on stored pairs, applied to both the focused plots and scan.
# Both members must pass this inclusive ToT interval (ns).
cuts.member_tot_min_ns: 0
cuts.member_tot_max_ns: 1e9
# -1 disables the extra cut. These do not undo upstream replay selections.
cuts.layer_dt_max_ns: -1
cuts.pair_radius_max: -1

# Histogram display ranges, NOT selection cuts. Sigma includes overflow.
plots.bin_width_ns: 0.5
plots.le_min_ns: 0
plots.le_max_ns: 80
plots.layer_dt_min_ns: -30
plots.layer_dt_max_ns: 30
plots.ecal_dt_min_ns: -100
plots.ecal_dt_max_ns: 50
plots.min_entries_per_bar: 30

# 0: display only; 1: save all three canvases as PNG and PDF plus per-bar CSV.
# Paths are relative to the current working directory. Reusing a directory
# with the same run/bar overwrites those outputs; use a new directory per study.
output.save_plots: 0
output.directory: pairing_plots/run6077_baseline
