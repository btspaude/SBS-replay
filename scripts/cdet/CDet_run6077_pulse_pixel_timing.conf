# Shared configuration for Plot_CDet_PulseStudy.C and Plot_CDet_PulsePixelTiming.C.
# Occupancy uses its own CDet_run6077_occupancy_response.conf.
config.version: 1

# Run loading: -1 events reads all; -1/-1 segments selects all groups.
analysis.run_number: 6077
analysis.events: 10000000
analysis.min_segment: -1
analysis.max_segment: -1

# Early PulseStudy event cuts, applied before the hit loop (strict bounds).
# ECal energy is GeV; ADC time is ns. Replay ecal_eligible is also required.
# PulsePixelTiming uses the energy bounds but its time selection is the replay flag.
analysis.ecal_energy_min: 3.0
analysis.ecal_energy_max: 4.5
analysis.ecal_time_min: -10.0
analysis.ecal_time_max: 10.0

# Pulse-quality windows in ns. LE bounds are inclusive in the plotting routines.
# PulseStudy loading ALWAYS applies strict TotMin < ToT < TotMax.
# Each plotting macro has its own apply_tot_cut switch for the inclusive window.
# The stored broad_quality_pass flag is not required.
analysis.le_min: 0.02
analysis.le_max: 60
analysis.tot_min: 8
analysis.tot_max: 40

# Maximum |rx| in plotPulseStudyBars/Positions when the ellipse is disabled.
# This legacy key name is retained; loading also requires replay spatial_pass.
analysis.x_difference_max: 0.08
# Reserved alternative key; currently unused.
analysis.x_res_max: 0.08

# Optional single-pulse ellipse in corrected dt versus x residual.
# Radius -1 disables it; positive values enable it. Keep off for initial offsets.
# All PulseStudy plots use branch dt for the ellipse selection.
good_pulse.single_residual_center_m: 0.0
good_pulse.single_timing_center_ns: -26.0
good_pulse.single_residual_scale_m: 0.040
good_pulse.single_timing_scale_ns: 5.0
good_pulse.single_cut_radius: -1.0

# Histogram axes only: these do not impose selection cuts.
# Raw-LE axes for both PulseStudy routines (ns).
display.le_min: 0.02
display.le_max: 60

# ToT axis for raw LE versus ToT (ToT on x, raw LE on y), in ns.
display.tot_min: 0
display.tot_max: 60

# Shared dt axes for both macros (ns); values outside the axes remain in flow bins.
display.ecal_cdet_dt_min: -90
display.ecal_cdet_dt_max: 0

# Reserved for a future ECal ADC-time histogram (ns); currently unused.
# These display bounds are not event or pulse cuts.
display.ecal_time_min: -15
display.ecal_time_max: 15

# Global, zero-based bar IDs: bar 19 = pixels 304..319.
# Used by PulsePixelTiming and the interactive plotPulseStudyBars routine.
pulse_pixel_timing.study_bar: 19
pulse_pixel_timing.control_bar: 30

# PulsePixelTiming PDFs: PulsePixelTiming/<tag>/ in the working directory.
# Empty tag defaults to run<run>_bar<study>_control<control>.
# Explicit call tags override this key; reusing a tag replaces matching PDFs.
# Tags allow letters, numbers, underscores, and hyphens.
pulse_pixel_timing.output_tag:

# PulsePixelTiming only: optional ToT window, 0 off / 1 on.
# Uses inclusive analysis.tot_min/max; finite positive ToT is always required.
pulse_pixel_timing.apply_tot_cut: 0

# PulsePixelTiming Gaussian + linear-background fits only (not pulse cuts).
# PulseStudy routines do not fit the spectra.
pulse_pixel_timing.fit_min_ns: -55.0
pulse_pixel_timing.fit_max_ns: -10.0
pulse_pixel_timing.min_fit_entries: 35

# ---------------------------------------------------------------------------
# PulseStudy-specific settings (secondary plotting routines)
# ---------------------------------------------------------------------------
# Optional secondary ToT window: 0 off, 1 on; uses inclusive analysis.tot_min/max.
# Independent of pulse_pixel_timing.apply_tot_cut.
# Loading ALWAYS applies strict analysis.tot_min/max, regardless of this switch.
# With unchanged bounds, enabling this adds no rejection to the saved sample.
# Tightening the bounds after loading can further restrict the plotted pulses.
pulse_study.apply_tot_cut: 0

# Batch plotPulseStudy("this.conf", "tag"): four PDFs per selected bar.
# Summed/4x4 stored dt and summed/4x4 raw LE versus ToT; no windows are opened.
# LE uses vPulseLe in ns, without the extra timing corrections.
# Binning uses ceil((axis max - axis min)/requested width) over the fixed range.
pulse_study.dt_bin_width_ns: 1.0
pulse_study.first_bar: 0
pulse_study.last_bar: 167

# All PulseStudy plotting routines save under PusleStudy/<tag>/.
# Empty tag defaults to run<run>; a call's tag overrides this key.
# Same tag rules as above; reusing a tag replaces matching PDFs.
pulse_study.output_tag:

# Optional SECONDARY ECal cuts for all PulseStudy plotting routines (0 off, 1 on).
# Strict energy bounds in GeV and ADC-time bounds in ns; enable either or both.
# These only narrow saved events. Plotting does not reapply analysis.ecal_*.
# Widening them cannot recover events excluded during loading.
pulse_study.apply_ecal_energy_cut: 0
pulse_study.ecal_energy_min: 3.0
pulse_study.ecal_energy_max: 4.5
pulse_study.apply_ecal_time_cut: 0
pulse_study.ecal_time_min: -10
pulse_study.ecal_time_max: 10

# Interactive plotPulseStudyBars("this.conf", "tag", studyBar, controlBar).
# Defaults to the configured study/control bars; explicit arguments override them.
# Eight canvases per bar: summed and 4x4 pixel dt, raw LE, raw LE versus ToT,
# and stored dt versus rx (pulse.ecal_residual versus pulse.ecal_x_residual).
# Leaves all sixteen canvases open and saves a separate PDF for each.
# All plots use identical selected pulses; every dt plot uses vPulseDt.
# For dt-versus-rx plots without an ellipse, keep single_cut_radius at -1.
# Both routines use display.le_min/max and display.tot_min/max for LE versus ToT.
# Call from an interactive ROOT/analyzer session; this routine does not enable batch.
pulse_study.le_bin_width_ns: 1.0

# LE and ToT bin widths are shared by both PulseStudy plotting routines (ns).
pulse_study.tot_bin_width_ns: 1.0

# Interactive plotPulseStudyPositions("this.conf", "tag", studyBar, controlBar).
# One x/rx overlay per bar; same cut options as plotPulseStudyBars.
# 1 uses aligned pulse.x_corr; 0 uses original channel pulse.x. rx stays stored.
# Position bounds are shared by the overlaid histograms and are NOT cuts (metres).
pulse_study.position_use_corrected_x: 1
pulse_study.position_bin_width_m: 0.005
pulse_study.position_min_m: -1.6
pulse_study.position_max_m: 1.6
