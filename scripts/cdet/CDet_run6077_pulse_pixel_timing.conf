# Shared configuration for Plot_CDet_PulseStudy.C and Plot_CDet_PulsePixelTiming.C.
# Occupancy uses its own CDet_run6077_occupancy_response.conf.
config.version: 1

# Run loading: -1 events reads all; -1/-1 segments selects all groups.
analysis.run_number: 6077
# Optional PulseStudy plot label; does not change cuts or output filenames.
# Use lh2 or cross target; omit/leave blank for only the run number.
analysis.target: lh2
analysis.events: 10000000
analysis.min_segment: -1
analysis.max_segment: -1

# Early PulseStudy event cuts, applied before the hit loop (strict bounds).
# ECal energy is GeV; ADC time is ns. Replay ecal_eligible is also required.
# PulsePixelTiming uses the energy bounds but its time selection is the replay flag.
analysis.ecal_energy_min: 3.0
# PulseStudy only: retain the maximum for opt-in studies; 0 disables the upper cut.
analysis.apply_ecal_energy_max: 0
analysis.ecal_energy_max: 5.0
analysis.ecal_time_min: -5
analysis.ecal_time_max: 3

# Pulse-quality windows in ns. LE bounds are inclusive in the plotting routines.
# PulseStudy loading always requires ToT > TotMin; TotMax is optional.
# Each plotting macro has its own apply_tot_cut switch; PulseStudy max is optional.
# The stored broad_quality_pass flag is not required.
analysis.le_min: 0.02
analysis.le_max: 30
analysis.tot_min: 8
# PulseStudy loading upper ToT cut: 0 off (default), 1 on. Lower cut stays active.
analysis.apply_tot_max: 0
analysis.tot_max: 40

# PulseStudy loading requires finite |rx| <= this value (m), with |ry| <= 0.36 m.
# This replaces replay spatial_pass; widen here and rerun the main macro to load
# pulses beyond the replay x window. The replay eligibility/calibration flags remain.
# Secondary bar/position routines also use this rx bound when the ellipse is off;
# extractBarOffsets always applies it. Loading rx remains active with an ellipse.
analysis.x_difference_max: 0.08
# Reserved alternative key; currently unused.
analysis.x_res_max: 0.08

# Optional single-pulse ellipse in corrected dt versus x residual.
# Radius -1 disables it; positive values enable it. Keep off for initial offsets.
# All PulseStudy plots use branch dt for the ellipse selection.
good_pulse.single_residual_center_m: 0.0
good_pulse.single_timing_center_ns: -26.0
good_pulse.single_residual_scale_m: 0.040
good_pulse.single_timing_scale_ns: 5.0
good_pulse.single_cut_radius: -1.0

# Histogram axes only: these do not impose selection cuts.
# Raw-LE axes for both PulseStudy routines (ns).
display.le_min: 0.0
display.le_max: 35

# ToT axis for raw LE versus ToT (ToT on x, raw LE on y), in ns.
display.tot_min: 0
display.tot_max: 40

# Shared dt axes for both macros (ns); values outside the axes remain in flow bins.
display.ecal_cdet_dt_min: -60
display.ecal_cdet_dt_max: 0

# Reserved for a future ECal ADC-time histogram (ns); currently unused.
# These display bounds are not event or pulse cuts.
display.ecal_time_min: -15
display.ecal_time_max: 15

# Global, zero-based bar IDs: bar 19 = pixels 304..319.
# Used by PulsePixelTiming and the interactive plotPulseStudyBars routine.
pulse_pixel_timing.study_bar: 19
pulse_pixel_timing.control_bar: 30

# PulsePixelTiming PDFs: PulsePixelTiming/<tag>/ in the working directory.
# Empty tag defaults to run<run>_bar<study>_control<control>.
# Explicit call tags override this key; reusing a tag replaces matching PDFs.
# Tags allow letters, numbers, underscores, and hyphens.
pulse_pixel_timing.output_tag:

# PulsePixelTiming only: optional ToT window, 0 off / 1 on.
# Uses inclusive analysis.tot_min/max; finite positive ToT is always required.
pulse_pixel_timing.apply_tot_cut: 0

# PulsePixelTiming Gaussian + linear-background fits only (not pulse cuts).
# extractBarOffsets uses the separate pulse_study fit windows below.
pulse_pixel_timing.fit_min_ns: -55.0
pulse_pixel_timing.fit_max_ns: -10.0
pulse_pixel_timing.min_fit_entries: 35

# ---------------------------------------------------------------------------
# PulseStudy-specific settings (secondary plotting routines)
# ---------------------------------------------------------------------------
# Secondary ToT cut: 0 off, 1 on (default); inclusive analysis.tot_min, optional max.
# Independent of pulse_pixel_timing.apply_tot_cut.
# Loading always applies the lower ToT cut; its upper cut has a separate switch.
# Keep analysis.apply_tot_max=0 when loading for upper-ToT cut scans.
# Tightening the bounds after loading can further restrict the plotted pulses.
pulse_study.apply_tot_cut: 1
# Optional secondary upper limit, used when apply_tot_cut=1. Uses analysis.tot_max.
pulse_study.apply_tot_max: 0

# Batch plotPulseStudy("this.conf", "tag"): four PDFs per selected bar.
# Summed/4x4 stored dt and summed/4x4 raw LE versus ToT; no windows are opened.
# LE uses vPulseLe in ns, without the extra timing corrections.
# Binning uses ceil((axis max - axis min)/requested width) over the fixed range.
pulse_study.dt_bin_width_ns: 1.0
pulse_study.first_bar: 0
pulse_study.last_bar: 167

# Standard PulseStudy plotting routines save under PusleStudy/<tag>/.
# extractBarOffsets uses PusleStudy/ directly and ignores this output tag.
# Empty tag defaults to run<run>; a call's tag overrides this key.
# Same tag rules as above; reusing a tag replaces matching PDFs.
pulse_study.output_tag:

# SECONDARY ECal cuts for standard plotting routines: 0 off, 1 on.
# Energy lower cut defaults on; the upper energy cut and time cut default off.
# extractBarOffsets currently reads these secondary bounds but does not apply them.
# Strict energy bounds in GeV and ADC-time bounds in ns; enable either or both.
# These only narrow saved events. Plotting does not reapply analysis.ecal_*.
# Widening them cannot recover events excluded during loading.
pulse_study.apply_ecal_energy_cut: 1
# Optional secondary upper energy limit, used when apply_ecal_energy_cut=1.
pulse_study.apply_ecal_energy_max: 0
pulse_study.ecal_energy_min: 3.0
pulse_study.ecal_energy_max: 5.0
pulse_study.apply_ecal_time_cut: 0
pulse_study.ecal_time_min: -3
pulse_study.ecal_time_max: 2

# Interactive plotPulseStudyBars("this.conf", "tag", studyBar, controlBar).
# Defaults to the configured study/control bars; explicit arguments override them.
# Thirteen canvases per selected bar: dt, raw/corrected LE, LE versus ToT,
# pixel grids, dt versus rx, and the LE/ToT cut comparison.
# Two additional fixed bar-30 plots: raw/corrected LE versus ECal ADC time.
# Leaves all canvases open and saves a separate PDF for each.
# All plots use identical selected pulses; every dt plot uses vPulseDt.
# For dt-versus-rx plots without an ellipse, keep single_cut_radius at -1.
# Both routines use display.le_min/max and display.tot_min/max for LE versus ToT.
# Call from an interactive ROOT/analyzer session; this routine does not enable batch.
pulse_study.le_bin_width_ns: 1.0
# ECal-time bin width for 1D ADC-time plots and bar-30 LE-versus-ECal heat maps (ns).
# Bounds use display.ecal_time_min/max; LE uses display.le_min/max.
pulse_study.ecal_time_bin_width_ns: 1.0

# LE and ToT bin widths are shared by both PulseStudy plotting routines (ns).
pulse_study.tot_bin_width_ns: 1.0

# Interactive plotPulseStudyPositions("this.conf", "tag", studyBar, controlBar).
# One x/rx overlay per bar; same cut options as plotPulseStudyBars.
# 1 uses aligned pulse.x_corr; 0 uses original channel pulse.x. rx stays stored.
# Position bounds are shared by the overlaid histograms and are NOT cuts (metres).
pulse_study.position_use_corrected_x: 1
pulse_study.position_bin_width_m: 0.005
pulse_study.position_min_m: -1.6
pulse_study.position_max_m: 1.6

# ---------------------------------------------------------------------------
# extractBarOffsets: individual donor fits and full-bar/half-bar inheritance
# ---------------------------------------------------------------------------
# Fit windows in ns, applied with ROOT's R option; these are not loading cuts.
# Starting windows preserve the macro defaults. Inspect the spectra and adjust
# for the run/bar before fitting; these are not validated peak windows.
# Control bar comes from pulse_pixel_timing.control_bar above (default 30).
pulse_study.control_fit_min: -40.0
pulse_study.control_fit_max: 0.0
pulse_study.fit_min: -50.0
pulse_study.fit_max: -10.0

# The saved sample already passed the main analysis ECal/time/ToT and replay flags.
# This routine additionally requires finite dt/rx and |rx| <= analysis.x_difference_max.
# It does not apply secondary ECal/LE/ToT cuts, the ellipse, or multiplicity cuts.
# Its study/control histograms use display.ecal_cdet_dt_min/max and
# pulse_study.dt_bin_width_ns above (currently 1 ns); fit windows are independent.
# Study bar, donor pixels, fullNINO, calibration file, and CSV writing are call arguments.
# viewOnly=true: all 16 study/control histograms, no fits/calibration read/CSV.
# viewOnly=false: fit selected donors, keep their individual offsets, and assign
# weighted donor centers to the other pixels within the chosen full/half-bar groups.
# Plot files are PDFs under PusleStudy/; writeCSV defaults off and never changes the DB.

# ---------------------------------------------------------------------------
# getBarSigma("this.conf", "tag"): control dt, detector dt, sigma/yield versus bar
# Sigma plot also shows an inverse-variance weighted mean over valid fits in
# first_bar..last_bar; its error assumes independent bar fits (no systematics).
# ---------------------------------------------------------------------------
# Interactive golden-ratio canvases; three PDFs under PusleStudy/<tag>/.
# Uses the control_bar, dt display/binning, and secondary cuts configured above.
# first_bar/last_bar restrict the graph only; the detector sum includes all bars.
# Fits gaus(0) + pol1(3) over pulse_study.fit_signal_min/max (ns).
# These bounds define the fitted interval and constrain the signal mean.
# Minimum entries INSIDE that interval; at least six occupied bins also needed.
# fit_sigma is the starting signal width, not fixed. Reports sigma with fit error.
# pulse_study.fit_min/max above are for extractBarOffsets, not getBarSigma.
# Black points at zero mean insufficient statistics or an unusable fit, not zero width.
# A dt-dependent ellipse can bias the width; disable it for an untruncated spectrum.
pulse_study.min_fit_entries: 100
pulse_study.fit_signal_min: -36.0
pulse_study.fit_signal_max: -20.0
pulse_study.fit_sigma: 4.0

# getBarSigma per-bar yields: raw pulses in each fitted mean +/- N*sigma per
# ECal-selected event, including events with zero CDet hits. Not a rate in Hz.
# Secondary ECal cuts apply to numerator and denominator; no background subtraction.
# Plot: peak_yield_vs_bar.pdf (L1 red, L2 blue; unavailable fits marked at zero).
# Rerun the main analysis once to populate the complete ECal denominator sample.
pulse_study.peak_nsigma: 2.0

# Optional y-propagation diagnostic: getBarSigma applies it only to bar 30.
# plotPulseStudyBars("this.conf", "bars_y", true) applies it to both selected bars
# and the fixed bar-30 plots: plotted dt += correction; corrected LE -= correction.
# Its raw LE and all selection cuts remain unchanged; default is off.
# Off unless explicitly enabled: getBarSigma("this.conf", "bar30_y", true).
# Uses vECalYProjection and DB channel y; L=0.50 m.
# y_readout = y_DB + L/2 (LHS) or y_DB - L/2 (RHS); d=abs(y_readout-y_projected).
# dt_y = dt + delay*(d-L/2); LE_corr_y = LE_corr - delay*(d-L/2).
# Selections still use original dt/raw LE; saved vectors are unchanged.
# Effective propagation delay includes reflected photon paths; units ns/m.
# This replaces y_correction_refractive_index; old n values are not used.
pulse_study.y_propagation_ns_per_m: 7.0

# All PulseStudy plot routines save routine-specific *_cuts.txt beside PDFs.
# Cut boxes are omitted; run/bar titles, legends and fit results remain.
# plotPulseStudyPositionCorrelations("this.conf", "positions", controlBar).
# Control bar defaults to pulse_pixel_timing.control_bar (30); no study-bar plots.
# Six PDFs for the control bar, six for the detector, and six per layer:
# raw/aligned x and DB y versus BOTH native ECal coordinates and projection to
# each pixel z. Detector plots include all accepted pulses once, independent of
# the control bar. Full-detector filenames start detector_*; layer plots use
# layer1_* / layer2_*. L1/L2 share axes/color scales.
# Four additional 1D PDFs: raw/aligned x minus ECal projected x for each layer.
# Two more 1D PDFs: detector_cdet_x (channel x per accepted pulse) and
# detector_ecal_x_native (unprojected ECal x, once/event with an accepted pulse).
# Two fixed bar-30 PDFs also show channel/aligned x minus ECal projected x.
# Additional overlay: detector_cdet_x_and_ecal_x_native.pdf, without normalization.
# Blue: channel CDet x per pulse; red: native ECal x once per accepted event.
# Position correlations now have 38 interactive canvases total.
# Single-pulse position plots share cuts, including rx; layer combinations and
# bar-30 multiplicity have the selection exceptions described below.
# ECal is horizontal; CDet is vertical. Uses pulse_study.position_min_m/max_m
# and position_bin_width_m for both axes, plus the usual secondary cuts.
# Control-bar displays auto-zoom to occupied bins, sharing raw/aligned x bounds.
# Padding is in metres (minimum one bin). Empty plots retain detector bounds.
# This only zooms the display; binning, selected counts and flow bins are unchanged.
pulse_study.control_position_padding_m: 0.02
# 1D coordinate-difference axes (m); bin width uses position_bin_width_m above.
# No extra residual offset is subtracted. Out-of-range entries stay in flow bins.
pulse_study.position_difference_min_m: -0.20
pulse_study.position_difference_max_m: 0.20
# Single-pulse selection uses stored rx/dt, including for raw-x plots.
# Optional signal dt window ONLY for plotPulseStudyPositionCorrelations.
# Inclusive bounds on stored pulse.ecal_residual, before the optional y correction.
# Applies to single-pulse plots, including the native ECal event spectrum and bar 30.
# Layer combinations ALWAYS require the bar-30 signal dt window; L2 is unrestricted
# by secondary pulse cuts. Multiplicity is counted before secondary pulse cuts.
# Suggested starting bounds match this run's fit window; tune after inspecting signal.
pulse_study.position_apply_dt_cut: 0
pulse_study.position_dt_min_ns: -36.0
pulse_study.position_dt_max_ns: -20.0
# Same-event layer plots: x2 vs x1 and x2-x1, channel AND aligned x.
# x1 is each bar-30 pulse passing secondary ECal/LE/ToT/rx-or-ellipse cuts AND
# position_dt_min_ns <= stored dt <= position_dt_max_ns (even if its toggle is 0).
# Every saved L2 pulse in that event is combined with EVERY qualifying bar-30 pulse.
# L2 has only loading cuts; no additional dt/rx/LE/ToT cuts. These are not replay pairs.
# Old configs missing position_dt_min/max fall back to fit_signal_min/max.
# Layer-difference display bounds (m), bin width = position_bin_width_m.
pulse_study.layer_difference_min_m: -1.6
pulse_study.layer_difference_max_m: 1.6
# bar030_hits_per_event.pdf: one entry per ECal-selected event with >=1 saved
# bar-30 pulse. Count ALL saved bar-30 pulses before secondary pulse/dt cuts;
# x axis is total N, so additional hits = N-1. Unit-width bins cover observed N.
# plotPulseStudyBars also saves dt_before_y_vs_ecal_y_projected for each selected bar.
# It always uses pre-y-correction dt, with the usual bar cuts (not the window above).
# Projected y uses position_min_m/max_m/bin_width_m; display zooms to occupied bins
# plus two bins of padding. dt uses display.ecal_cdet_dt_min/max and dt_bin_width_ns.


# Upper-bound switches above affect Plot_CDet_PulseStudy.C only, not other macros
# sharing this file. Existing max values are retained; histogram display maxima
# still only set axes. Reload the main vectors to recover previously rejected hits.
# To scan an upper ToT cut without reloading: keep analysis.apply_tot_max=0,
# set pulse_study.apply_tot_cut=1 and pulse_study.apply_tot_max=1, then vary
# analysis.tot_max between secondary calls. The ECal opportunity denominator
# does not depend on the ToT cut. Main loading still imposes the ToT lower cut.

# plotPulseStudyEventMaps(config, tag, savedEventIndex=-1): two layer occupancy
# maps plus two single-event maps and a coincident-pulse count versus all 168 bars.
# -1 selects the first saved event passing secondary ECal cuts; otherwise supply
# a ZERO-BASED saved-vector index, not a replay event number. No bar-30 gate.
# No secondary rx/ry/ellipse cut. Main loading cuts still limit saved pulses.
# CDet x (vertical) uses position_use_corrected_x and position_min_m/max_m/bin_width_m.
# CDet y (horizontal): polygon cells span 50 cm, centered on each bar DB ypos.
# Staggered bar centers are respected; physical gaps stay empty.
# Dashed guides at bar-center x extend only from that bar y-0.25 to y+0.25 m.
# X cells follow the configured x grid, clipped at bar boundaries; y is not a measured along-bar hit coordinate.
# Both map types/layers use the full geometry, even if a side has no saved hits.
# DB path is relative to this config file; use the geometry from your replay.
pulse_study.map_database_file: ../../DB/db_earm.cdet.dat
# Horizontal y is the DB bar center, not a reconstructed along-bar position.
# Aggregate maps follow position_apply_dt_cut. Single-event maps and bar counts
# ALWAYS require position_dt_min_ns <= stored dt <= position_dt_max_ns.
# Usual secondary ECal, raw LE and ToT cuts apply. No y timing correction.
# All PulseStudy plots show compact energy/timing/position selections; full
# settings and exceptions remain in each routine's *_cuts.txt file.
