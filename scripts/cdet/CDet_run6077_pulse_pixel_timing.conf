# CDet pulse timing and LE/ToT configuration.
# Occupancy and projection diagnostics: CDet_run6077_occupancy_response.conf.
config.version: 1

# Main analysis
analysis.run_number: 6077
analysis.events: 10000000
analysis.calibration_stage: 7
analysis.group_index: 0
analysis.min_segment: -1
analysis.max_segment: -1
# Explicit inclusive pulse-quality windows in ns, before fitted pixel offsets.
# These replace broad_quality_pass in Plot_CDet_PulsePixelTiming.C.
analysis.le_min: 0.02
analysis.le_max: 60
# PulseStudy loading always applies these ToT bounds strictly.
# Timing/plotting routines apply the inclusive window only when apply_tot_cut is 1.
analysis.tot_min: 8
analysis.tot_max: 40
analysis.ecal_energy_min: 3.0
analysis.ecal_energy_max: 4.5
# PulseStudy rejects events outside this strict ADC-time window before its hit loop.
# The per-pulse ecal_eligible flag still supplies replay cluster/position/time checks.
analysis.ecal_time_min: -10.0
analysis.ecal_time_max: 10.0
analysis.layer1_hits_min: 1
analysis.layer1_hits_max: 100
analysis.layer2_hits_min: 1
analysis.layer2_hits_max: 100
analysis.x_difference_max: 0.08
analysis.x_offset: 0.0

# LH2 bar-timing diagnostics. Saved per-pixel polygons override this window.
diagnostics.accepted_tot_min: 8
diagnostics.accepted_tot_max: 40

# Analyzer-backed good-pulse and Layer-1/Layer-2 pair diagnostics.  The pair
# ellipse matches the authoritative LH2 pairing configuration in
# DB/db_earm.cdet.dat.  LE and ToT limits here are histogram display ranges;
# These legacy good_pulse LE/ToT display settings are not used by the standalone
# pulse-timing macro; its explicit quality windows are analysis.le_* and tot_*.
good_pulse.bin_width_ns: 1.0
good_pulse.le_min_ns: 0.0
good_pulse.le_max_ns: 60.0
good_pulse.tot_min_ns: 0.0
good_pulse.tot_max_ns: 40.0
good_pulse.recovered_only: false
good_pulse.pair_residual_center_m: 0.0
good_pulse.pair_timing_center_ns: -26.0
good_pulse.pair_residual_scale_m: 0.020
good_pulse.pair_timing_scale_ns: 5.0
good_pulse.pair_cut_radius: 2.0
# Optional ellipse used by Plot_CDet_PulsePixelTiming.C on individual pulses.
# Radius -1 disables it; a positive radius enables it (2 reproduces the
# documented single-pulse ellipse shape, NOT exclusive one-layer recovery).
# The pair_* ellipse settings above are not used by this macro.
# Keep disabled for initial offset extraction: a timing cut can bias the fit.
good_pulse.single_residual_center_m: 0.0
good_pulse.single_timing_center_ns: -26.0
good_pulse.single_residual_scale_m: 0.040
good_pulse.single_timing_scale_ns: 5.0
good_pulse.single_cut_radius: -1.0
good_pulse.opposite_side_enable: true
good_pulse.opposite_dy_center_m: 0.51
good_pulse.opposite_dy_tolerance_m: 0.08
good_pulse.opposite_projected_y_center_m: 0.0
good_pulse.opposite_projected_y_max_m: 0.17

# Symmetric ECal ADC-time window scan about zero.  The energy interval and
# ellipse parameters are shared with analysis.* and good_pulse.* above.
pair_scan.min_half_width_ns: 0.5
pair_scan.max_half_width_ns: 10.0
pair_scan.step_ns: 0.5

# Layer comparison and interactive event display
display.overwrite: false
display.pixel: 485
display.histogram_width: 1
display.layer_dt_min: -15
display.layer_dt_max: 15
display.layer_dx_min: -0.15
display.layer_dx_max: 0.15
display.le_min: 0.02
display.le_max: 60
display.tot_min: 8
display.tot_max: 40
display.dt_hist_min: -20
display.dt_hist_max: 20
display.cdet_time_min: 0
display.cdet_time_max: 60
display.cdet_tot_min: 8
display.cdet_tot_max: 40
# ECal ADC-time histogram axis limits only, not selection cuts.
display.ecal_time_min: -15
display.ecal_time_max: 15
# Standalone pulse timing: dt axes for all 1D and dt-versus-dx plots (ns).
# Explicit macro axis arguments override these display bounds; these are not cuts.
display.ecal_cdet_dt_min: -90
display.ecal_cdet_dt_max: 0
display.allow_multiple_pairs: true
display.x_bin_width: 0.005
display.x_min: -0.9
display.x_max: -0.5
display.z_bin_width: 0.01
display.z_min: 5
display.z_max: 7

# Standalone pulse timing comparison. This is an independent copy of
# CDet_run6077_projection.conf; changes here do not change that configuration.
# The macro reads analysis.run_number, analysis.events, analysis.min_segment,
# analysis.max_segment, analysis.ecal_energy_min/max, and analysis.le_min/max.
# It also reads good_pulse.single_* for the optional pulse ellipse. The 2D
# before panel includes the usual cuts; after appears only with the ellipse on.
# When enabled, the 1D pixel/bar histograms and fits use ellipse-selected pulses.
# LE and LE-versus-ToT use the same selected pulses as the 1D timing plots.
# The detector-wide dt-versus-dx plot uses the same cuts, over both layers.
# ECal time and projection selections remain the stored replay flags. Other
# legacy analysis/display settings do not replace those flags.
# Bar IDs are global and zero-based: bar 19 = pixels 304..319.
pulse_pixel_timing.study_bar: 19
pulse_pixel_timing.control_bar: 30

# Save every canvas as a PDF under PulsePixelTiming/<tag>/ in the working directory.
# Empty defaults to run<run>_bar<study>_control<control>; a tagged macro call overrides
# this setting. Use letters, numbers, underscores, and hyphens (no spaces/slashes).
# Reusing a tag replaces matching PDFs; use a new tag to preserve another selection.
pulse_pixel_timing.output_tag:

# 0 ignores the ToT window; 1 applies inclusive analysis.tot_min/max in ns.
# Calibration still requires finite positive ToT. No broad_quality_pass gate
# is applied, so values outside replay's 4--30 ns window remain available.
# Setting 1 with LE 0.02--60 and ToT 4--30 reproduces the previous quality cut.
pulse_pixel_timing.apply_tot_cut: 0

# dt axes use display.ecal_cdet_dt_min/max above; missing keys fall back to
# -150..150 ns. dt-versus-dx follows the 1D dt range unless explicitly overridden.
# Binning and other axes remain macro arguments (LE -20..100 ns, ToT 0..100 ns).
# Display bounds are not selection cuts; outside-axis counts are retained/reported.

# Gaussian + linear background fits, shared by pixels and summed bar spectra.
# These limits restrict the fits only, not which pulses fill the histograms.
# Histogram binning remains controlled by the macro arguments.
pulse_pixel_timing.fit_min_ns: -55.0
pulse_pixel_timing.fit_max_ns: -10.0
pulse_pixel_timing.min_fit_entries: 35

# PulseStudy secondary routine: plotPulseStudy("this.conf", "subfolder_tag").
# Batch-only: saves summed dt and 4x4 pixels for both corrected branch dt and uncorrected dt
# (ECal ADC time minus raw CDet LE, both saved in ns): four PDFs/bar, no fits/windows.
# Both sets use identical pulses with finite branch/manual dt. If enabled,
# the ellipse selects using branch dt for both sets, preserving the comparison.
# Rereads analysis.le_*, analysis.tot_*, pulse_pixel_timing.apply_tot_cut,
# good_pulse.single_*, and the optional secondary ECal cuts below.
# ECal windows are strict; LE/ToT and ellipse bounds are inclusive.
# Finite positive ToT is required even with its window disabled.
# PulseStudy loading already requires replay eligibility/spatial/calibration flags.
# Can only select events/pulses retained by the main PulseStudy loading call.
# Axes use display.ecal_cdet_dt_min/max; outside-axis entries stay in flow bins.
# Requested width gives ceil((max-min)/width) uniform bins over that range.
pulse_study.dt_bin_width_ns: 1.0
pulse_study.first_bar: 0
pulse_study.last_bar: 167
# Saves PDFs under PusleStudy/<tag>/ relative to the working directory.
# The call's tag overrides this key; empty defaults to run<analysis.run_number>.
# Letters, numbers, underscores, hyphens only; reusing a tag replaces its PDFs.
pulse_study.output_tag:

# Optional SECONDARY ECal cuts for both PulseStudy plotting routines (0 off, 1 on).
# analysis.ecal_energy_* / analysis.ecal_time_* select events before the hit loop.
# Loading also requires the stored pulse.ecal_eligible flag.
# These independent windows further restrict saved events, without rereading ROOT.
# The plotting routine does not reapply analysis.ecal_* from an edited config.
# Bounds are strict, in GeV and ns respectively. Enable either window or both.
# Initial bounds match the energy defaults and Run 6077 replay time window.
# Tighten them as desired; the replay flag retains its original DB time window.
# Widening these cannot recover events excluded by the loading cuts.
pulse_study.apply_ecal_energy_cut: 0
pulse_study.ecal_energy_min: 3.0
pulse_study.ecal_energy_max: 4.5
pulse_study.apply_ecal_time_cut: 0
pulse_study.ecal_time_min: -10
pulse_study.ecal_time_max: 10

# Interactive two-bar summary: plotPulseStudyBars("this.conf", "subfolder_tag").
# Uses pulse_pixel_timing.study_bar/control_bar, or explicit bar arguments.
# One visible canvas per bar: summed raw dt and LE above two 4x4 pixel grids.
# Raw dt = ECal ADC time - vPulseLe; vPulseLe is already in ns.
# Same cuts as plotPulseStudy; if enabled, the ellipse still selects on branch dt.
# Same dt display/binning and output folder/tag; LE axes use display.le_min/max.
# Saves two *_raw_summary.pdf files and leaves both canvases open.
# Does not enable batch mode; call from an interactive ROOT/analyzer session.
pulse_study.le_bin_width_ns: 1.0
