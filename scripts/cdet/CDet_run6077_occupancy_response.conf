# Standalone Plot_CDet_OccupancyResponse.C configuration.
# Independent of the pulse-timing config; edit each study's cuts explicitly.
# ECal energy/time cuts have strict bounds. LE/ToT windows are inclusive.
# Time reference is ECal-only; selected response also uses replay eligibility,
# calibration and spatial flags. No broad_quality_pass requirement.
config.version: 1
analysis.run_number: 6077
analysis.events: 10000000
analysis.min_segment: -1
analysis.max_segment: -1
analysis.le_min: 0.02
analysis.le_max: 60
analysis.tot_min: 4
analysis.tot_max: 40
analysis.ecal_time_min: -10.000
analysis.ecal_time_max: 10.000
analysis.ecal_energy_min: 3.0
analysis.ecal_energy_max: 4.5

# Final-selected response: optional pulse ellipse; -1 disables it.
# Uses stored residuals, with no recalibration.
good_pulse.single_residual_center_m: 0.0
good_pulse.single_timing_center_ns: -26.0
good_pulse.single_residual_scale_m: 0.040
good_pulse.single_timing_scale_ns: 5.0
good_pulse.single_cut_radius: -1.0

# Study/control bar zooms. Global zero-based bar IDs; 16 pixels per bar.
occupancy_response.study_bar: 19
occupancy_response.control_bar: 30
# PDFs/CSV under OccupancyResponse/<tag>/; empty uses run/bar/control.
occupancy_response.output_tag:
# 0: no ToT window; 1: apply analysis.tot_min/max. Positive ToT is still required.
occupancy_response.apply_tot_cut: 0

# Separate event occupancy versus logical pixel ID, including both layers and
# study/control-bar zooms. Each event contributes at most once to each pixel.
# 1: baseline uses the same ECal-selected sample as the x-matched curve.
# 0: baseline uses all stored complete pulses (no ECal requirement).
# ECal selected = energy window above + replay ecal_eligible + finite stored dx.
# This comparison does not apply LE/ToT windows, spatial_pass (which includes y),
# timing-residual cuts, or the ellipse. It is an occupancy, not an efficiency.
# All electronic slots are shown, including unused slots; zero occupancy alone
# does not identify a failed channel. All three counts remain available in ROOT:
# hPixelOccupancyRaw, hPixelOccupancyECal, and hPixelOccupancyXMatched.
occupancy_response.occupancy_use_ecal_baseline: 1
occupancy_response.occupancy_dx_max_m: 0.08

# Independent projection opportunities: energy and timing windows above, valid
# ECal cluster, and finite x/y. No CDet pulse, quality flag, or pair is required.
# Paths are relative to this config. Timestamp must match the run/replay geometry;
# this selects Kin3 z=5.75/5.85 m for run 6077, not the earlier Kin1 positions.
# DB x alignment, residual offsets, and unused-pixel masks are read at this date.
projection.database_file: ../../DB/db_earm.cdet.dat
projection.database_timestamp: 2025-08-24 05:58:38
projection.ecal_z_m: 6.144
# Half-windows: +/-8 cm in x and +/-36 cm in y (the replay matching convention).
# The y window distinguishes half-bars, with overlap permitted near the seam.
# Each compatible paddle receives one opportunity per event, including silent
# instrumented paddles. These broad-window response fractions are NOT intrinsic
# paddle efficiencies. Zero opportunities is undefined, not a zero response.
projection.dx_max_m: 0.08
projection.dy_max_m: 0.36
# Complete response = >=1 stored pulse in that paddle. Selected response = >=1
# pulse passing existing good_final, including its replay flags and optional cuts.
# Additional PDFs show opportunity/response counts, conditional fractions with
# 68.3% binomial intervals, and ECal-only x versus final-selected-event ECal x.
# A projection_response_run<run>.csv in the tagged folder records all pixel counts.
